<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="musicGrad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="recordCenter" cx="32" cy="32" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="80%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#18181b" />
    </radialGradient>
    <filter id="musicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f43f5e" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#09090b" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#musicGrad)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Vinyl Record Body -->
  <circle cx="32" cy="32" r="23" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
  
  <!-- Vinyl Lathe Grooves -->
  <circle cx="32" cy="32" r="19" stroke="#3f3f46" stroke-width="1" stroke-dasharray="24 4" stroke-opacity="0.6" />
  <circle cx="32" cy="32" r="15" stroke="#3f3f46" stroke-width="1" stroke-dasharray="18 4" stroke-opacity="0.6" />

  <!-- Center Vinyl Label -->
  <circle cx="32" cy="32" r="10" fill="url(#recordCenter)" filter="url(#musicGlow)" />
  <circle cx="32" cy="32" r="3" fill="#09090b" />
  
  <!-- Audio Soundwave Equilizer Overlay (Top/Bottom Vibrancy) -->
  <line x1="26" y1="28" x2="26" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="25" x2="32" y2="39" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="38" y1="29" x2="38" y2="35" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
</svg>